name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install checksum-verified Gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - run: npm run security:scan
      - run: npm run security:files
      - run: npm run test:security-scanner

  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  vscode:
    name: VS Code integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install VS Code and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2t64 libgtk-3-0t64 libnss3 libxss1 libxkbfile1
          curl -fsSL "https://update.code.visualstudio.com/latest/linux-x64/stable" -o vscode.tar.gz
          mkdir "$RUNNER_TEMP/vscode"
          tar -xzf vscode.tar.gz -C "$RUNNER_TEMP/vscode" --strip-components=1
          rm vscode.tar.gz
      - name: Run graphical test
        env:
          TMPDIR: ${{ runner.temp }}
          VSCODE_CLI: ${{ runner.temp }}/vscode/bin/code
          VSCODE_ARGS: --no-sandbox --disable-gpu
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:vscode
      - name: Upload graphical failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-failure-diagnostics
          path: |
            ${{ runner.temp }}/murmurplex-vscode-*/profile/logs/**
            ${{ runner.temp }}/murmurplex-vscode-*/project/integration-result.json
            ${{ runner.temp }}/murmurplex-vscode-*/project/layout-result.json
          if-no-files-found: warn
          retention-days: 7
