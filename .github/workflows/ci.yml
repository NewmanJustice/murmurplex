name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  vscode:
    name: VS Code integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install VS Code and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2t64 libgtk-3-0t64 libnss3 libxss1 libxkbfile1
          curl -fsSL "https://update.code.visualstudio.com/latest/linux-x64/stable" -o vscode.tar.gz
          mkdir "$RUNNER_TEMP/vscode"
          tar -xzf vscode.tar.gz -C "$RUNNER_TEMP/vscode" --strip-components=1
          rm vscode.tar.gz
      - name: Run graphical test
        env:
          VSCODE_CLI: ${{ runner.temp }}/vscode/bin/code
          VSCODE_ARGS: --no-sandbox --disable-gpu
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:vscode
